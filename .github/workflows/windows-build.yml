name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore tests
        run: dotnet restore .\tests\DropLink.Tests\DropLink.Tests.csproj
      - name: Test
        run: dotnet test .\tests\DropLink.Tests\DropLink.Tests.csproj -c Release --no-restore
      - name: Publish self-contained app
        run: dotnet publish .\src\DropLink\DropLink.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: DropLink-Native-win-x64
          path: .\artifacts\win-x64\

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DropLink-Native-win-x64
          path: artifacts/win-x64
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DropLink ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/win-x64/DropLink.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
